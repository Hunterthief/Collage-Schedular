<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="College Schedule">
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
  <!-- time axis -->
  <line x1="13" y1="16" x2="13" y2="50" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
  <!-- gantt bars = lecture / practical / examination -->
  <rect x="16" y="18" width="28" height="8" rx="4" fill="#1a73e8"/>
  <rect x="16" y="30" width="40" height="8" rx="4" fill="#188038"/>
  <rect x="16" y="42" width="22" height="8" rx="4" fill="#d93025"/>
</svg>

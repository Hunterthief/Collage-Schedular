<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Schedule</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/schedule.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>College Schedule</h1>
        <p class="privacy-notice">
          Your student ID is only a lookup key. It is not a password. Schedules are public.
        </p>
      </header>

      <section class="lookup">
        <form id="lookup-form">
          <label for="student-id">University Student ID</label>
          <input id="student-id" name="student-id" autocomplete="off" required />
          <button type="submit">View my schedule</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
      </section>

      <section id="result" hidden>
        <div id="assignment-summary"></div>

        <nav class="tabs">
          <button data-view="weekly" class="active">Weekly</button>
          <button data-view="daily">Daily</button>
          <button data-view="upcoming">Upcoming</button>
        </nav>

        <div id="timetable"></div>

        <section class="calendar-subscription">
          <h2>Google Calendar</h2>
          <div id="calendar-links"></div>
        </section>
      </section>
    </main>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data
        run: python tools/validate-data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show discovered test files
        run: |
          find . -path ./node_modules -prune -o \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.cjs' \) -print \
            | sort

      - name: Run tests
        run: |
          count=$(find . -path ./node_modules -prune -o \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.cjs' \) -print \
            | wc -l)
          echo "Found $count test file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.js / *.test.mjs / *.test.cjs files found. Commit your tests folder (the files must be named like foo.test.mjs)."
            exit 1
          fi
          node --test

      - name: Generate calendar feeds
        run: node tools/generate-calendars.mjs

      - name: Upload generated feeds
        uses: actions/upload-artifact@v4
        with:
          name: calendar-feeds
          path: calendar/feeds

name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data
        run: python tools/validate-data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: |
          count=$(find . -path ./node_modules -prune -o \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.cjs' \) -print \
            | wc -l)
          echo "Found $count test file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.js / *.test.mjs / *.test.cjs files found. Commit your tests folder."
            exit 1
          fi
          node --test

      - name: Generate calendar feeds
        run: node tools/generate-calendars.mjs

      - name: Publish feeds into the repository so GitHub Pages serves them
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add .nojekyll calendar/feeds
          if git diff --cached --quiet; then
            echo "Feeds unchanged; nothing to commit."
          else
            git commit -m "chore: regenerate calendar feeds [skip ci]"
            git push
          fi

      - name: Upload generated feeds
        uses: actions/upload-artifact@v4
        with:
          name: calendar-feeds
          path: calendar/feeds
